gemini:
  model: "gemini-3.5-flash"
  temperature: 0.1
  max_output_tokens: 8192
  response_mime_type: "application/json"

paths:
  input_dir: "input"
  processed_dir: "processed"
  failed_dir: "failed"
  output_dir: "output"
  logs_dir: "logs"

processing:
  max_workers: 2
  retry_attempts: 5
  retry_initial_wait: 2
  retry_max_wait: 60
  request_timeout: 120

excel:
  filename_template: "claims_extract_{timestamp}.xlsx"
  sheet_name: "Claims"
  columns:
    - key: "source_file"
      header: "ไฟล์ต้นทาง"
    - key: "page_range"
      header: "หน้าที่ใช้"
    - key: "received_date"
      header: "วันที่รับเอกสาร"
    - key: "received_by"
      header: "ผู้รับเอกสาร"
    - key: "insured_name"
      header: "ชื่อผู้เอาประกันภัย"
    - key: "policy_number"
      header: "เลขที่กรมธรรม์"
    - key: "claim_type"
      header: "ประเภทการเคลม"
    - key: "claimed_amount"
      header: "ยอดเรียกร้อง"
    - key: "remark"
      header: "หมายเหตุ"

classification_prompt: |
  คุณคือเจ้าหน้าที่จำแนกเอกสารประกันสุขภาพ ทำหน้าที่ดูเอกสาร PDF "หน้านี้เพียงหน้าเดียว"
  แล้วจำแนกประเภทและดึง identifier สำหรับใช้จัดกลุ่ม

  จำแนก page_type เป็นค่าใดค่าหนึ่งต่อไปนี้เท่านั้น:
  - "policy_schedule" : หน้าตารางกรมธรรม์ / หน้าสรุปกรมธรรม์ (Policy Schedule)
  - "claim_form" : แบบฟอร์มเรียกร้องค่าสินไหมทดแทน (Claim Form)
  - "insurance_card" : บัตรประกัน / สำเนาบัตรประกัน
  - "receipt" : ใบเสร็จรับเงิน / ใบแสดงรายการค่าใช้จ่าย
  - "medical_certificate" : ใบรับรองแพทย์ / ใบรับรองการรักษา
  - "medical_record" : ประวัติการรักษา / Discharge Summary / Lab Report
  - "id_document" : สำเนาบัตรประชาชน / ทะเบียนบ้าน / หนังสือเดินทาง
  - "stamp_page" : หน้าที่มีตราประทับรับเอกสารเป็นเนื้อหาหลัก
  - "other" : ไม่จัดอยู่ในหมวดข้างต้น

  พร้อมดึง identifier (ถ้าไม่พบให้ใส่ "N/A"):
  - policy_number : เลขที่กรมธรรม์ (อ่านจากตัวพิมพ์เป็นหลัก คงเครื่องหมาย - หรือ / ตามต้นฉบับ)
  - insured_name : ชื่อ-นามสกุลผู้เอาประกันภัย (อ่านจากตัวพิมพ์เท่านั้น ห้ามเดาจากลายมือ)
  - received_date : วันที่จากตราประทับรับเอกสาร รูปแบบ DD-MM-YYYY (ถ้ามี)
  - received_by : ชื่อ/รหัสพนักงานจากตราประทับรับเอกสาร (ถ้ามี)

  ตอบกลับเป็น JSON object เพียงตัวเดียวเท่านั้น (ไม่ใช่ array):
  {
    "page_type": "claim_form",
    "policy_number": "A1234-5678",
    "insured_name": "นายสมชาย ใจดี",
    "received_date": "24-05-2026",
    "received_by": "นางสาวอารยา",
    "page_summary": "<สรุปสั้น 1 บรรทัดว่าเอกสารหน้านี้คืออะไร>"
  }

extraction_prompt: |
  คุณคือเจ้าหน้าที่ฝ่ายสินไหมทดแทนประกันสุขภาพ (Health Claims Examiner) ที่มีความเชี่ยวชาญและละเอียดรอบคอบ ทำหน้าที่ตรวจเช็กเอกสารในไฟล์ PDF ที่แนบมานี้ เพื่อดึงข้อมูลประกอบการพิจารณาสินไหม

  เอกสารชุดนี้เป็น "เคลม 1 ราย" ที่ผ่านการจัดกลุ่มมาแล้ว — เป้าหมายของคุณคือดึงข้อมูล 1 รายการ (1 object ใน array)

  โปรดอ่านเอกสาร PDF ทั้งหมดอย่างละเอียด และดึงข้อมูลตามโครงสร้างและ "กฎเหล็ก" ต่อไปนี้อย่างเคร่งครัด (ห้ามคิดเอาเองเด็ดขาด หากไม่มีให้ใส่ "N/A"):

  1. received_date (วันที่รับเอกสาร)
  - ค้นหาจาก "ตราประทับรับเอกสาร" หรือข้อความที่ระบุวันที่รับเอกสารเข้าสู่ระบบ
  - หากมีตราประทับหลายวันที่ ให้เลือกวันที่จากตราประทับล่าสุดเป็นหลัก
  - แปลงรูปแบบวันที่ให้เป็น: DD-MM-YYYY (เช่น 24-05-2026)

  2. received_by (ชื่อผู้รับเอกสาร)
  - อ่านชื่อหรือรหัสพนักงานจากตราประทับรับเอกสาร
  - หากอ่านไม่ออก ไม่มีชื่อ หรือไม่มีตราประทับ ให้ใส่ "N/A"

  3. insured_name (ชื่อ-นามสกุลผู้เอาประกันภัย)
  - ดึงชื่อเต็ม (ชื่อ + นามสกุล) จากหน้าตารางกรมธรรม์, บัตรประกัน, ใบเสร็จรับเงิน, หรือใบรับรองแพทย์ ที่เป็น "อักษรพิมพ์" ก่อนเป็นอันดับแรก
  - หากเป็นภาษาไทย ให้คงรูปแบบภาษาไทย / หากเป็นภาษาอังกฤษ ให้คงรูปแบบภาษาอังกฤษ
  - ห้ามคาดเดาชื่อจากลายมือเด็ดขาด หากไม่พบในระบบตัวพิมพ์ให้ใส่ "N/A"

  4. policy_number (เลขที่กรมธรรม์)
  - ดึงข้อมูลเรียงตามลำดับความสำคัญ (Priority) ดังนี้:
    1) อ่านจาก "หน้าตารางกรมธรรม์" (หน้าสรุปข้อมูล)
    2) หากไม่มี: อ่านจาก "ตัวพิมพ์" ในเอกสารอื่น เช่น เคลมฟอร์ม หรือสำเนาบัตรประกัน
    3) หากไม่มี: อ่านจาก "ลายมือเขียน" ในแบบฟอร์ม หรือเอกสารนำส่งเคลม
  - ห้ามแก้ไขหรือเปลี่ยนแปลงรูปแบบเครื่องหมาย (เช่น - หรือ /) ที่อ่านได้ ให้คงไว้ตามต้นฉบับ หากไม่พบเลยให้ใส่ "N/A"

  5. claim_type (ประเภทการเคลม)
  - วิเคราะห์และจัดประเภทเป็นค่าใดค่าหนึ่งต่อไปนี้เท่านั้น:
    * "OPD" : กรณีผู้ป่วยนอก (ไม่นอนโรงพยาบาล)
    * "IPD" : กรณีผู้ป่วยใน (มีการนอนพักรักษาตัวในโรงพยาบาล)
    * "Major" : กรณียื่นเคลมประกันมะเร็ง, โรคร้ายแรง, เสียชีวิต, ทุพพลภาพถาวรสิ้นเชิง หรือสูญเสียอวัยวะ

  6. claimed_amount (ยอดเรียกร้อง)
  - ค้นหาจาก "ใบเสร็จรับเงิน" หรือ "รายการค่าใช้จ่าย" ทั้งหมดที่มีในไฟล์
  - ให้คำนวณรวมยอดเงินทุกรายการเข้าด้วยกัน (ระวัง! ห้ามนับยอดเงินซ้ำซ้อนจากเอกสารใบสรุป)
  - แสดงผลเป็นตัวเลขทศนิยม 2 ตำแหน่งเท่านั้น เช่น 1500.00 (ไม่ต้องใส่เครื่องหมายสกุลเงิน เช่น ฿ หรือ THB)

  7. remark (หมายเหตุ)
  - หากตรวจสอบพบว่าเป็น "กรมธรรม์นักเรียน/กลุ่มสถานศึกษา" ให้ระบุ "ชื่อโรงเรียนหรือวิทยาลัย" ที่อ่านได้จากเอกสาร
  - หากไม่พบชื่อโรงเรียน หรือไม่ใช่กรมธรรม์นักเรียน ให้ใส่ "N/A"

  ---
  [กฎการแสดงผลลัพธ์]
  - ส่งกลับเป็น JSON Array ที่มี 1 object (ตามที่อธิบายไว้ข้างต้น เพราะเอกสารชุดนี้คือเคลม 1 ราย)
  - หากตรวจพบว่ามีผู้เอาประกันภัยมากกว่า 1 คนปะปนกันมาในเอกสารชุดนี้จริงๆ ค่อยส่งกลับเป็นหลาย object
  - ห้ามเติมคำอธิบายอื่นนอกเหนือจากโครงสร้าง JSON

  [ตัวอย่างโครงสร้างผลลัพธ์ที่ต้องการ]
  [
    {
      "received_date": "24-05-2026",
      "received_by": "นายสมชาย ใจดี",
      "insured_name": "นางสาวสมศรี มีทรัพย์",
      "policy_number": "A1234-5678",
      "claim_type": "OPD",
      "claimed_amount": 2450.50,
      "remark": "โรงเรียนวิทยาศาสตร์แห่งชาติ"
    }
  ]
